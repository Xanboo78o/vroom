<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VROOM</title>
<link rel="stylesheet" href="./style.css?v=1787335811">
<script src="./js/vendor/supabase.js"></script>
<!-- every module URL is stamped (?v=) by .git/hooks/pre-commit so a plain reload after a
     deploy never mixes new index.html with 10-minute-cached old JS/CSS (GitHub Pages max-age) -->
<script type="importmap">
{ "imports": {
    "three": "./js/vendor/three.module.min.js",
    "./js/main.js": "./js/main.js?v=1787335811",
    "./js/machine.js": "./js/machine.js?v=1787335811",
    "./js/parts.js": "./js/parts.js?v=1787335811",
    "./js/guy.js": "./js/guy.js?v=1787335811",
    "./js/art.js": "./js/art.js?v=1787335811",
    "./js/net.js": "./js/net.js?v=1787335811",
    "./js/voice.js": "./js/voice.js?v=1787335811",
    "./js/world.js": "./js/world.js?v=1787335811",
    "./js/ring.js": "./js/ring.js?v=1787335811"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- ================= menu ================= -->
<div id="menu">
  <div class="card">
    <h1>VROOM<span class="sub">build it · race it · lose a wheel</span></h1>
    <input id="nm" maxlength="12" placeholder="your name" autocomplete="off">
    <button id="soloBtn" class="big go">SANDBOX (solo)</button>
    <div class="row">
      <div class="col">
        <div class="lbl">repairs</div>
        <label><input type="radio" name="rep" id="repAny" checked> anywhere</label>
        <label><input type="radio" name="rep" id="repPit"> pit only</label>
        <button id="createBtn" class="big">CREATE ROOM</button>
      </div>
      <div class="col">
        <div class="lbl">got a code?</div>
        <input id="code" maxlength="4" placeholder="ABCD" class="codein" autocomplete="off">
        <button id="joinBtn" class="big">JOIN</button>
      </div>
    </div>
    <div id="menuMsg"></div>
  </div>
</div>

<!-- ================= hud ================= -->
<div id="hud" class="hide">
  <div id="roomChip" class="chip tr" style="display:none"></div>
  <div id="peers" class="chip tr2"></div>
  <button id="vcBtn" class="chip vc" style="display:none">🎙 VC</button>
  <div id="lap" class="chip tc"></div>
  <div id="speed" class="chip bc"></div>
  <div id="bars">
    <div class="bar"><i>FUEL</i><div class="fill fuel" id="fuelFill"></div></div>
    <div class="bar"><i>BATT</i><div class="fill batt" id="battFill"></div></div>
  </div>
  <div id="board"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
</div>

<!-- ================= the cursor (crisp, 90°, no smoothing) ================= -->
<div id="cur" aria-hidden="true">
  <svg width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <path fill="#c43f38" d="M1 1h12v6H7v6H1z M31 1v12h-6V7h-6V1z M1 31V19h6v6h6v6z M31 31H19v-6h6v-6h6z"/>
    <path fill="#e8574f" d="M2 2h10v4H6v6H2z M30 2v10h-4V6h-6V2z M2 30V20h4v6h6v4z M30 30H20v-4h6v-6h4z"/>
    <rect x="12" y="12" width="8" height="8" fill="#c43f38"/>
    <rect x="13" y="13" width="6" height="6" fill="#e8574f"/>
  </svg>
</div>

<script type="module" src="./js/main.js?v=1787335811"></script>
</body>
</html>
