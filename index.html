<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kRacing</title>
<link rel="stylesheet" href="./style.css?v=1787355850">
<script src="./js/vendor/supabase.js"></script>
<!-- every module URL is stamped (?v=) by .git/hooks/pre-commit so a plain reload after a
     deploy never mixes new index.html with 10-minute-cached old JS/CSS (GitHub Pages max-age) -->
<script type="importmap">
{ "imports": {
    "./js/main.js": "./js/main.js?v=1787355850",
    "./js/ring.js": "./js/ring.js?v=1787355850",
    "./js/parts.js": "./js/parts.js?v=1787355850",
    "./js/machine.js": "./js/machine.js?v=1787355850",
    "./js/world.js": "./js/world.js?v=1787355850",
    "./js/tracks.js": "./js/tracks.js?v=1787355850",
    "./js/corner.js": "./js/corner.js?v=1787355850",
    "./js/guy.js": "./js/guy.js?v=1787355850",
    "./js/art.js": "./js/art.js?v=1787355850",
    "./js/draw.js": "./js/draw.js?v=1787355850",
    "./js/tiles.js": "./js/tiles.js?v=1787355850",
    "./js/garage.js": "./js/garage.js?v=1787355850",
    "./js/palette.js": "./js/palette.js?v=1787355850",
    "./js/net.js": "./js/net.js?v=1787355850",
    "./js/voice.js": "./js/voice.js?v=1787355850",
    "./js/adamtrack.js": "./js/adamtrack.js?v=1787355850"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- ================= menu ================= -->
<div id="menu">
  <div class="card">
    <h1 id="logo">kRacing<span class="sub">build it · race it · lose a wheel</span></h1>
    <input id="nm" maxlength="12" placeholder="your name" autocomplete="off">
    <button id="soloBtn" class="big go">SANDBOX (solo)</button>
    <div class="row">
      <div class="col">
        <div class="lbl">repairs</div>
        <label><input type="radio" name="rep" id="repAny" checked> anywhere</label>
        <label><input type="radio" name="rep" id="repPit"> pit only</label>
        <button id="createBtn" class="big">CREATE ROOM</button>
      </div>
      <div class="col">
        <div class="lbl">got a code?</div>
        <input id="code" maxlength="4" placeholder="ABCD" class="codein" autocomplete="off">
        <button id="joinBtn" class="big">JOIN</button>
      </div>
    </div>
    <div id="menuMsg"></div>
  </div>
</div>

<!-- ================= hud ================= -->
<div id="hud" class="hide">
  <div id="roomChip" class="chip tr" style="display:none"></div>
  <div id="peers" class="chip tr2"></div>
  <button id="vcBtn" class="chip vc" style="display:none">🎙 VC</button>
  <div id="lap" class="chip tc"></div>
  <div id="speed" class="chip bc"></div>
  <div id="bars">
    <div class="bar"><i>FUEL</i><div class="fill fuel" id="fuelFill"></div></div>
    <div class="bar"><i>BATT</i><div class="fill batt" id="battFill"></div></div>
  </div>
  <div id="board"></div>
  <div id="prompt"></div>
</div>

<script type="module" src="./js/main.js?v=1787355850"></script>
</body>
</html>
